<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Controle Financeiro</h1>
        <p>Organize suas receitas e despesas</p>
        <section class="resumo">
            <div class="cartao saldo">
                <h2>Saldo Atual</h2>
                <p id="saldo">R$ 0,00</p>
            </div>

            <div class="cartao receitas">
                <h2>Receitas</h2>
                <p id="receitas">R$ 0,00</p>
            </div>

            <div class="cartao despesas">
                <h2>Despesas</h2>
                <p id="despesas">R$ 0,00</p>
            </div>


        </section>

        <section class="nova-movimentacao">
            <h2>Adicionar movimentação</h2>

            <form id="form-movimentacao">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" placeholder="Ex.: Salário" required>

                <label for="valor">Valor</label>
                <input type="number" id="valor" placeholder="Ex.: 1500" step="0.01" required>

                <label for="tipo">Tipo</label>
                <select id="tipo">
                    <option value="receita">Receitas</option>
                    <option value="despesa">Despesas</option>
                </select>
                <button type="submit">Adicionar</button>



            </form>
        </section>
        <section class="movimentacoes">
            <h2>Movimentações</h2>
            <ul id="lista-movimentacoes"></ul>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
